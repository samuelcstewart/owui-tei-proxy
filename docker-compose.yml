# Local-dev compose for owui-tei-proxy.
#
# Brings up a Hugging Face TEI reranker (cpu-1.8.3,
# cross-encoder/ms-marco-MiniLM-L-6-v2) with this proxy on a shared
# network, then `curl http://localhost:8000/rerank` exercises the
# public side end-to-end.
#
# TEI has no /v1/rerank in 1.8.x — only the native POST /rerank —
# which is exactly the gap this proxy fills for Open WebUI.
#
# Usage:
#   docker compose up -d --build      # dev stack (TEI reranker + proxy)
#   curl -X POST http://localhost:8000/rerank \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"reranker","query":"capital of France","documents":["Paris is the capital of France.","Berlin is the capital of Germany."],"top_n":2}' | jq
#   curl http://localhost:8000/health | jq
#   docker compose down               # tear down
#
# NOTE: the first TEI start downloads the model (~100 MB) and loads
# it on CPU; the proxy's /health will return 503 until that finishes
# (typically 1-3 minutes). `poe integration-test` waits for this.

services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    container_name: owui-tei-dev-upstream
    command:
      - --model-id
      - cross-encoder/ms-marco-MiniLM-L-6-v2
      - --auto-truncate
      - --max-client-batch-size
      - "256"
    healthcheck:
      # TEI exposes GET /health once the model is loaded.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - owui-tei-net

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: owui-tei-dev-proxy
    depends_on:
      tei:
        condition: service_started
    environment:
      TEI_RERANKER_URL: http://tei:80
      RERANK_TIMEOUT_SECS: "30"
      MAX_CLIENT_BATCH_SIZE: "256"
    ports:
      - "8000:8000"
    networks:
      - owui-tei-net

networks:
  owui-tei-net:
    driver: bridge
